name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase resources
        run: firebase deploy --project exam-9f830 --only hosting,firestore --non-interactive

  storage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase Storage CORS
        run: |
          set -euo pipefail

          bucket="$(
            node <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/firebase-config.js", "utf8");
          const match = text.match(/storageBucket:\s*["']([^"']+)["']/);
          if (!match) process.exit(1);
          process.stdout.write(match[1]);
          NODE
          )"

          test -n "$bucket" || {
            echo "::error::Could not determine Firebase Storage bucket from js/firebase-config.js."
            exit 1
          }

          candidates=("$bucket")
          if [[ "$bucket" == *.firebasestorage.app ]]; then
            candidates+=("exam-9f830.appspot.com")
          elif [[ "$bucket" == *.appspot.com ]]; then
            candidates+=("exam-9f830.firebasestorage.app")
          fi

          found=false
          for candidate in "${candidates[@]}"; do
            if gcloud storage buckets describe "gs://$candidate" --project=exam-9f830 >/dev/null 2>&1; then
              echo "Configuring Storage CORS on gs://$candidate"
              gcloud storage buckets update "gs://$candidate" --cors-file=storage.cors.json
              found=true
              break
            fi
          done

          if [[ "$found" != true ]]; then
            echo "::warning::Firebase Storage bucket is not available to this CI service account. Storage CORS/rules deployment was skipped."
            exit 0
          fi

      - name: Deploy Firebase Storage rules
        run: firebase deploy --project exam-9f830 --only storage --non-interactive
