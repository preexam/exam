name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::GitHub Actions Firebase service-account secret is missing."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Configure Firebase Storage CORS
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"

          bucket="$(sed -nE 's/.*storageBucket:[[:space:]]*['"'"']([^'"'"']+)['"'"'].*/\1/p' js/firebase-config.js | head -n 1)"
          test -n "$bucket" || { echo "::error::Could not determine Firebase Storage bucket from js/firebase-config.js."; exit 1; }

          candidates=("$bucket")
          if [[ "$bucket" == *.firebasestorage.app ]]; then
            candidates+=("exam-9f830.appspot.com")
          elif [[ "$bucket" == *.appspot.com ]]; then
            candidates+=("exam-9f830.firebasestorage.app")
          fi

          found=false
          for candidate in "${candidates[@]}"; do
            if gcloud storage buckets describe "gs://$candidate" --project=exam-9f830 >/dev/null 2>&1; then
              echo "Configuring Storage CORS on gs://$candidate"
              gcloud storage buckets update "gs://$candidate" --cors-file=storage.cors.json
              found=true
              break
            fi
          done

          if [[ "$found" != true ]]; then
            echo "::error::Firebase Storage bucket is not available to this service account. Checked: ${candidates[*]}"
            echo "::error::Provision Firebase Storage for project exam-9f830 or grant the CI service account bucket access, then rerun this workflow."
            exit 1
          fi

      - name: Deploy Firebase resources
        run: firebase deploy --project exam-9f830 --only hosting,firestore,storage --non-interactive
