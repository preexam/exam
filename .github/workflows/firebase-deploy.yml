name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::GitHub Actions Firebase service-account secret is missing."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Configure Firebase Storage CORS
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"

          bucket="$(gcloud storage buckets list --project=exam-9f830 --format='value(name)' | head -n 1)"
          test -n "$bucket" || { echo "::error::No Cloud Storage bucket found for Firebase project exam-9f830."; exit 1; }

          echo "Configuring Storage CORS on gs://$bucket"
          gcloud storage buckets update "gs://$bucket" --cors-file=storage.cors.json

      - name: Deploy Firebase resources
        run: firebase deploy --project exam-9f830 --only hosting,firestore,storage --non-interactive
