```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Login - Exam Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="brand">EXAM PORTAL ADMIN</div>

  <nav>
    <a href="index.html">Public Portal</a>
  </nav>
</header>


<main class="container">

  <!-- =========================
       ADMIN LOGIN
  ========================== -->

  <section id="login" class="card login-card">

    <h1>Admin Login</h1>

    <p class="muted">
      Sign in with your authorized administrator account.
    </p>

    <form id="loginForm">

      <label>
        Email
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
          placeholder="Admin email"
        >
      </label>


      <label>
        Password
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="Password"
        >
      </label>


      <button
        type="submit"
        class="btn primary"
      >
        Sign In
      </button>

      <p
        id="loginMsg"
        class="message"
        aria-live="polite"
      ></p>

    </form>

  </section>


  <!-- =========================
       ADMIN APPLICATION
       Hidden until authenticated
  ========================== -->

  <section id="app" hidden>

    <div class="admin-head">

      <div>

        <h1 id="title">
          Admin Control Center
        </h1>

        <p
          id="welcome"
          class="muted"
        ></p>

      </div>


      <div class="actions">

        <button
          id="changePassword"
          type="button"
          class="btn"
        >
          Change Password
        </button>

        <button
          id="logout"
          type="button"
          class="btn danger"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- Dashboard statistics -->

    <div id="stats" class="grid-4"></div>


    <!-- Admin modules -->

    <div id="tabs" class="tabs"></div>


    <!-- Current module -->

    <div
      id="panel"
      class="card"
    ></div>

  </section>

</main>


<!-- IMPORTANT:
     admin.js is inside js/ folder
-->
<script
  type="module"
  src="js/admin.js"
></script>

</body>
</html>
```
