<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="./favicon.ico">
  <title>BOOKESH Exam Portal | Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">

<header class="topbar"><a class="brand" href="index.html" aria-label="BOOKESH Exam Portal"><img class="brand-logo" src="assets/bookesh-logo.svg" alt="BOOKESH"><span class="brand-text"><strong>BOOKESH EXAM PORTAL</strong><small>Administrator Area</small></span></a><nav><a href="index.html">Public Portal ↗</a></nav></header>

<main class="container">
  <section id="login" class="card login-card">
    <div class="login-brand"><img class="login-logo" src="assets/bookesh-logo.svg" alt="BOOKESH logo"></div>
    <span class="eyebrow">SECURE ADMINISTRATOR ACCESS</span>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your examination portal.</p>

    <form id="loginForm">
      <label>Email
        <input id="email" type="email" required autocomplete="username" placeholder="admin@example.com">
      </label>
      <label>Password
        <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
      </label>
      <button type="submit" class="btn primary login-btn">Sign In <span>→</span></button>
      <p id="loginMsg" class="message" aria-live="polite"></p>
    </form>
    <div class="login-footer"><span class="secure-dot"></span> Protected administrator area</div>
  </section>

  <section id="app" hidden>
    <div class="admin-head">
      <div>
        <span class="eyebrow">BOOKESH ADMINISTRATOR DASHBOARD</span>
        <h1 id="title">Admin Control Center</h1>
        <p id="welcome" class="muted"></p>
      </div>
      <div class="actions">
        <button id="changePassword" type="button" class="btn">Change Password</button>
        <button id="logout" type="button" class="btn danger">Logout</button>
      </div>
    </div>

    <div id="stats" class="grid-4"></div>
    <div id="tabs" class="tabs"></div>
    <div id="panel" class="card admin-panel"></div>
  </section>
</main>

<script type="module" src="js/admin.js"></script>
</body>
</html>
