<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Control Center</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">EXAM PORTAL ADMIN</div><nav><a href="index.html">Public Portal</a></nav></header>
<main class="container">
<section id="login" class="card login-card"><h1>Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary">Sign In</button><p id="loginMsg" class="message"></p></form></section>
<section id="app" hidden><div class="admin-head"><div><h1 id="title">Admin Control Center</h1><p id="welcome" class="muted"></p></div><div class="actions"><button id="changePassword" class="btn">Change Password</button><button id="logout" class="btn danger">Logout</button></div></div>
<div id="stats" class="grid-4"></div>
<div id="tabs" class="tabs"></div><div id="panel" class="card"></div>
</section></main>
<script type="module" src="admin.js"></script>
</body></html>
