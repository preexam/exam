<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="application.css"></head><body><header class="topbar"><div class="brand">EXAM PORTAL</div><nav><a href="index.html">Home</a><a href="admit-card.html">Admit Card</a><a href="result.html">Result</a></nav></header><main class="container narrow"><div class="card"><span class="eyebrow">APPLICATION PORTAL</span><h1>Candidate Registration</h1><p class="muted intro">Create your account to start your examination application.</p><form id="registerForm"><label>Full Name<input id="regName" required></label><label>Date of Birth<input id="regDob" type="date" required></label><label>Mobile Number<input id="regMobile" inputmode="numeric" maxlength="10" required></label><div class="otp-row"><button type="button" class="btn" id="sendOtp">Send OTP</button><input id="otp" placeholder="Enter OTP" maxlength="6"></div><label>Password<input id="regPassword" type="password" minlength="6" required></label><button class="btn primary">Register</button><p id="regMsg" class="message"></p></form></div><div class="card"><span class="eyebrow">RETURNING CANDIDATE</span><h2>Already Registered?</h2><form id="loginForm"><label>Application Number<input id="loginApp" required></label><label>Password<input id="loginPass" type="password" required></label><button class="btn primary">Sign In</button><p id="loginMsg" class="message"></p></form></div></main><script type="module" src="application.js"></script></body></html>
